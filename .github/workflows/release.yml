# Builds the matching release branch from a tag or manual run.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag: vX.Y.Z.0, vX.Y.Z.W-beta.N or vX.Y.Z.W-test.N'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/amneziageo-server
  UPDATES_IMAGE: ghcr.io/${{ github.repository_owner }}/amneziageo-updates

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.policy.outputs.version }}
      channel: ${{ steps.policy.outputs.channel }}
      release_tag: ${{ steps.policy.outputs.release_tag }}
      source_commit: ${{ steps.policy.outputs.source_commit }}
      tag_exists: ${{ steps.policy.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check release policy
        run: python3 -m unittest discover -s .github/tests -p test_release_policy.py
      - name: Validate release source
        id: policy
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python3 .github/scripts/release_policy.py prepare \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --tag "$INPUT_TAG"

  package:
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
      TAG_EXISTS: ${{ needs.version.outputs.tag_exists }}
    needs: version
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            runtime: linux-x64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            runtime: linux-arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_commit }}
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: amneziageo-web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Tools the websocket tool is built with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libclang-dev musl-tools
      - name: Web dependencies
        run: npm --prefix amneziageo-web ci --no-audit --no-fund
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          deploy/publish.sh
          mkdir -p dist
          for kind in tar.gz pack files; do
            mv "out/amneziageo-server.$kind" "dist/amneziageo-server-$VERSION-linux-${{ matrix.arch }}.$kind"
          done
      - name: Package of the client updates server
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          deploy/publish.sh --updates
          mv out/amneziageo-updates.tar.gz "dist/amneziageo-updates-$VERSION-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  image:
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
      TAG_EXISTS: ${{ needs.version.outputs.tag_exists }}
    needs: version
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_commit }}
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.name }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.name }},mode=max,ignore-error=true
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest
        shell: bash
        run: |
          mkdir -p digests
          digest='${{ steps.build.outputs.digest }}'
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.name }}
          path: digests/*
          if-no-files-found: error

  manifest:
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
      TAG_EXISTS: ${{ needs.version.outputs.tag_exists }}
    needs: [version, image]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: merge
        shell: bash
        working-directory: digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if [ "${RELEASE_TAG#v}" != "$VERSION" ]; then
            tags+=(-t "$IMAGE:${RELEASE_TAG#v}")
          fi
          if [ "$CHANNEL" = stable ]; then
            tags+=(-t "$IMAGE:latest")
          fi

          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:${RELEASE_TAG#v}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The service of the client releases, an image of its own from the same tag.
  updates-image:
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
      TAG_EXISTS: ${{ needs.version.outputs.tag_exists }}
    needs: version
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            name: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_commit }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.updates
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.UPDATES_IMAGE }}:buildcache-${{ matrix.name }}
          cache-to: type=registry,ref=${{ env.UPDATES_IMAGE }}:buildcache-${{ matrix.name }},mode=max,ignore-error=true
          provenance: false
          outputs: type=image,name=${{ env.UPDATES_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest
        shell: bash
        run: |
          mkdir -p digests
          digest='${{ steps.build.outputs.digest }}'
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: updates-digest-${{ matrix.name }}
          path: digests/*
          if-no-files-found: error

  updates-manifest:
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
      TAG_EXISTS: ${{ needs.version.outputs.tag_exists }}
    needs: [version, updates-image]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: updates-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: merge
        shell: bash
        working-directory: digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          tags=(-t "$UPDATES_IMAGE:$VERSION")
          if [ "${RELEASE_TAG#v}" != "$VERSION" ]; then
            tags+=(-t "$UPDATES_IMAGE:${RELEASE_TAG#v}")
          fi
          if [ "$CHANNEL" = stable ]; then
            tags+=(-t "$UPDATES_IMAGE:latest")
          fi

          sources=()
          for digest in *; do
            sources+=("$UPDATES_IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$UPDATES_IMAGE:${RELEASE_TAG#v}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  publish:
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
      TAG_EXISTS: ${{ needs.version.outputs.tag_exists }}
    needs: [version, package, manifest, updates-manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_commit }}
          sparse-checkout: |
            deploy/amneziageo-server
            .github/scripts/release_policy.py
          sparse-checkout-cone-mode: false
      - name: Verify the release tag still matches
        shell: bash
        run: python3 .github/scripts/release_policy.py verify-tag --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --required "$TAG_EXISTS"

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Signed manifest
        shell: bash
        working-directory: release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
          UPDATES_DIGEST: ${{ needs.updates-manifest.outputs.digest }}
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "the secret UPDATE_SIGNING_KEY is not set" >&2
            exit 1
          fi

          packages=$(
            for file in amneziageo-server-*.tar.gz; do
              base=${file%.tar.gz}
              jq -n \
                --arg name "$file" \
                --arg arch "${base##*-linux-}" \
                --argjson size "$(stat -c %s "$file")" \
                --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
                --arg list "$base.files" \
                --argjson listSize "$(stat -c %s "$base.files")" \
                --arg listSha256 "$(sha256sum "$base.files" | cut -d' ' -f1)" \
                --arg pack "$base.pack" \
                --argjson packSize "$(stat -c %s "$base.pack")" \
                '{name: $name, arch: $arch, size: $size, sha256: $sha256,
                  files: {name: $list, size: $listSize, sha256: $listSha256},
                  pack: {name: $pack, size: $packSize}}'
            done | jq -s .
          )

          updates=$(
            for file in amneziageo-updates-*.tar.gz; do
              base=${file%.tar.gz}
              jq -n \
                --arg name "$file" \
                --arg arch "${base##*-linux-}" \
                --argjson size "$(stat -c %s "$file")" \
                --arg sha256 "$(sha256sum "$file" | cut -d' ' -f1)" \
                '{name: $name, arch: $arch, size: $size, sha256: $sha256}'
            done | jq -s .
          )

          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$SOURCE_COMMIT" \
            --arg image "$IMAGE@$DIGEST" \
            --argjson packages "$packages" \
            --arg updatesImage "$UPDATES_IMAGE@$UPDATES_DIGEST" \
            --argjson updates "$updates" \
            '{version: $version, channel: $channel, published: $published, commit: $commit, image: $image, packages: $packages,
              updates: {image: $updatesImage, packages: $updates}}' \
            > update.json

          key=$RUNNER_TEMP/update-signing.pem
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out update.json.sig update.json
          rm -f "$key"
          cat update.json
      - name: Release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --target "$SOURCE_COMMIT")
          if [ "$CHANNEL" != stable ]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi

          cp ../deploy/amneziageo-server amneziageo-server
          gh release create "$RELEASE_TAG" "${flags[@]}" amneziageo-server-*.tar.gz amneziageo-server-*.pack \
            amneziageo-server-*.files amneziageo-updates-*.tar.gz update.json update.json.sig amneziageo-server
