# The panel in the network of the host: it raises the interfaces of the endpoints in the kernel, lays the rules of the
# firewall and runs the websocket fronts itself. The host carries the amneziawg module and nothing else of the panel.
#
#   docker compose up -d --build
#   docker compose exec panel amneziageo-server init --user <name>
#   ssh -N -L 8443:127.0.0.1:8443 root@<host>

name: amneziageo-server

services:
  panel:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: ${AMNEZIAGEO_VERSION:-0.0.1}
    image: amneziageo-server:${AMNEZIAGEO_TAG:-local}
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file:
      - path: server.env
        required: false
    volumes:
      - data:/var/lib/amneziageo-server
      - settings:/etc/amneziageo-server
      - /etc/amnezia/amneziawg:/etc/amnezia/amneziawg
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  data:
  settings:
